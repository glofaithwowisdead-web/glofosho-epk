<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Updates — Glo Israel</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>.post .when{font-weight:500}.post .date{font-size:.85rem;opacity:.65}.post img.pic{width:100%;border:1px solid var(--gold)}.post .video{max-width:100%;margin:0}.post audio{width:100%}.post p{margin:0}</style></head><body>
<nav><div class="wrap"><a class="brand" href="index.html"><img src="images/logo-gold.png" alt="Glo Israel"></a><div class="navlinks"><a href="index.html#bio">Bio</a><a href="index.html#music">Music</a><a href="booking.html" >Booking</a><a href="updates.html" class="on">Updates</a><a href="contribute.html" >Contribute</a></div></div></nav>
<section><div class="wrap"><div class="head"><h2>Updates</h2><p>Shows, appearances, interviews, and news from Glo Israel.</p></div>
<div id="feed" style="display:grid;gap:24px;max-width:760px"><div class="note" style="margin:0">Loading updates...</div></div>
<div class="note">Want these in your inbox? <a href="https://buttondown.com/gloisraelmusic" target="_blank" rel="noopener" style="text-decoration:underline">Join the newsletter</a>.</div></div></section>
<script>
(function(){var F=document.getElementById('feed');
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function safe(u){return /^https?:\/\//i.test(u||'')?u:''}
function src(u){u=u||'';return(/^\/(?!\/)/.test(u)||/^https?:\/\//i.test(u))?u:''}
function yt(u){var m=(u||'').match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);return m?m[1]:''}
function fmt(d){var x=new Date(String(d).slice(0,10)+'T12:00:00');return isNaN(x)?'':x.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}
function body(t){return esc(t).split(/\n{2,}/).map(function(p){return'<p>'+p.replace(/\n/g,'<br>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" style="text-decoration:underline">$1</a>')+'</p>'}).join('')}
fetch('updates.json').then(function(r){return r.ok?r.json():[]}).catch(function(){return[]}).then(function(L){
if(!L.length){F.innerHTML='<div class="note" style="margin:0">Nothing posted yet. Check back soon.</div>';return}
F.innerHTML=L.map(function(p){var h='<article class="card post"><div class="tag">'+esc(p.category||'Announcement')+'</div><h3>'+esc(p.title)+'</h3>';
if(p.when)h+='<div class="when">'+esc(p.when)+'</div>';
if(p.date)h+='<div class="date">Posted '+fmt(p.date)+'</div>';
var im=src(p.image);if(im)h+='<img class="pic" src="'+esc(im)+'" alt="'+esc(p.title)+'">';
if(p.body)h+=body(p.body);
var y=yt(p.youtube_url);if(y)h+='<div class="video"><iframe src="https://www.youtube.com/embed/'+y+'" title="Video" allow="encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>';
var au=src(p.audio);if(au)h+='<audio controls preload="none" src="'+esc(au)+'"></audio>';
var lk=safe(p.link_url);if(lk)h+='<a class="btn btn-gold" href="'+esc(lk)+'" target="_blank" rel="noopener">'+esc(p.link_text||'Learn more')+'</a>';
return h+'</article>'}).join('')})})();
</script>
