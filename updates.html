<section><div class="wrap"><div class="head"><h2>Updates</h2><p>Shows, appearances, interviews, and news from Glo Israel.</p></div>
<div id="feed" style="display:grid;gap:24px;max-width:760px"><div class="note" style="margin:0">Loading updates...</div></div>
<div class="note">Want these in your inbox? <a href="https://buttondown.com/gloisraelmusic" target="_blank" rel="noopener" style="text-decoration:underline">Join the newsletter</a>.</div></div></section>
<script>
(function(){
var WP_SITE='gloisrael.wordpress.com'; /* EDIT: the WordPress.com blog address */
var F=document.getElementById('feed');
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function txt(h){return new DOMParser().parseFromString(h||'','text/html').body.textContent}
function fmt(d){var x=new Date(d);return isNaN(x)?'':x.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}
function clean(h){var d=new DOMParser().parseFromString(h||'','text/html');
d.querySelectorAll('script,style,link,object,embed,form,input,button,base,meta').forEach(function(n){n.remove()});
d.querySelectorAll('iframe').forEach(function(n){if(!/^https:\/\/(www\.youtube(-nocookie)?\.com|open\.spotify\.com|player\.vimeo\.com)\//.test(n.getAttribute('src')||''))n.remove()});
d.querySelectorAll('*').forEach(function(n){Array.from(n.attributes).forEach(function(a){var v=a.value.trim().toLowerCase();if(/^on/i.test(a.name)||((a.name==='href'||a.name==='src')&&/^(javascript|data):/.test(v)))n.removeAttribute(a.name)});if(n.tagName==='A'){n.target='_blank';n.rel='noopener'}});
return d.body.innerHTML}
fetch('https://public-api.wordpress.com/rest/v1.1/sites/'+WP_SITE+'/posts/?number=20&fields=ID,title,date,content,categories').then(function(r){return r.json()}).then(function(j){return j.posts||[]}).catch(function(){return[]}).then(function(L){
if(!L.length){F.innerHTML='<div class="note" style="margin:0">Nothing posted yet. Check back soon.</div>';return}
F.innerHTML=L.map(function(p){var c=Object.keys(p.categories||{}).filter(function(k){return k!=='Uncategorized'})[0]||'Update';
return'<article class="card post"><div class="tag">'+esc(c)+'</div><h3>'+esc(txt(p.title))+'</h3><div class="date">Posted '+esc(fmt(p.date))+'</div><div class="wp">'+clean(p.content)+'</div></article>'}).join('')})})();
</script>
